<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Video dengan Border Animasi</title>
  <style>
    /* Container video dan tombol */
    #player-container {
      max-width: 640px;
      margin: 20px auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      /* Border animasi 4 warna */
      border: 4px solid;
      border-radius: 20px; /* Sudut melengkung */
      padding: 5px;
      animation: borderGlow 4s linear infinite;
    }

    /* Video player */
    #player {
      width: 100%;
      height: 360px;
      border-radius: 16px; /* Sudut melengkung video */
      background: black;
      overflow: hidden;
    }

    /* Tombol */
    #sound-toggle {
      padding: 10px 20px;
      cursor: pointer;
      font-weight: bold;
      border: none;
      background-color: #444;
      color: white;
      border-radius: 12px; /* Sudut melengkung tombol */
      transition: background-color 0.3s ease;
    }

    #sound-toggle:hover {
      background-color: #666;
    }

    /* Animasi border 4 warna bergantian */
    @keyframes borderGlow {
      0% {
        border-color: red;
      }
      25% {
        border-color: orange;
      }
      50% {
        border-color: yellow;
      }
      75% {
        border-color: green;
      }
      100% {
        border-color: red;
      }
    }
  </style>
</head>
<body>

<div id="player-container">
  <div id="player"></div>
  <button id="sound-toggle">Aktifkan Suara</button>
</div>

<script>
  let player;
  const VIDEO_ID = 'nfghPVPu9VE';

  function onYouTubeIframeAPIReady() {
    player = new YT.Player('player', {
      videoId: VIDEO_ID,
      playerVars: {
        autoplay: 1,
        mute: 1,
        loop: 1,
        playlist: VIDEO_ID,
        controls: 1,
        modestbranding: 1,
        rel: 0,
        playsinline: 1
      }
    });
  }

  const tag = document.createElement('script');
  tag.src = "https://www.youtube.com/iframe_api";
  document.body.appendChild(tag);

  const btn = document.getElementById('sound-toggle');
  btn.addEventListener('click', () => {
    if (player.isMuted()) {
      player.unMute();
      btn.textContent = 'Matikan Suara';
    } else {
      player.mute();
      btn.textContent = 'Aktifkan Suara';
    }
  });
</script>

</body>
</html>
