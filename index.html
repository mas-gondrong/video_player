<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>YouTube Video Fullscreen with Sound Toggle</title>
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%; overflow: hidden;
    }
    #player {
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none; /* agar video tidak mengganggu klik kecuali tombol */
      z-index: -1;
    }
    #sound-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 10;
      background: rgba(0,0,0,0.5);
      color: white;
      border: none;
      padding: 10px 15px;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
      user-select: none;
      pointer-events: auto; /* agar tombol bisa diklik */
    }
  </style>
</head>
<body>

  <div id="player"></div>
  <button id="sound-toggle">Unmute</button>

  <script>
    let player;
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        videoId: 'Y0jQ6X30MiWOJPlR', // Ganti dengan ID video YouTube kamu
        playerVars: {
          autoplay: 1,
          controls: 0,
          modestbranding: 1,
          loop: 1,
          playlist: 'Y0jQ6X30MiWOJPlR', // loop butuh playlist sama dengan videoId
          mute: 1,
          rel: 0,
          playsinline: 1
        },
        events: {
          onReady: (event) => {
            event.target.playVideo();
          }
        }
      });
    }

    // Load YouTube IFrame API script
    let tag = document.createElement('script');
    tag.src = "https://youtu.be/YQ8qcoGEg4k?si=Y0jQ6X30MiWOJPlR";
    document.body.appendChild(tag);

    const btn = document.getElementById('sound-toggle');
    btn.addEventListener('click', () => {
      if (player.isMuted()) {
        player.unMute();
        btn.textContent = 'Mute';
      } else {
        player.mute();
        btn.textContent = 'Unmute';
      }
    });
  </script>

</body>
</html>
