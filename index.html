<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Embed Video YouTube Contoh</title>
  <style>
    #player {
      width: 640px;
      height: 360px;
      background: black;
      border-radius: 8px;
    }
    #sound-toggle {
      margin-top: 10px;
      padding: 8px 16px;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div id="player"></div>
<button id="sound-toggle">Aktifkan Suara</button>

<script>
  let player;
  const VIDEO_ID = 'nfghPVPu9VE';

  function onYouTubeIframeAPIReady() {
    player = new YT.Player('player', {
      videoId: VIDEO_ID,
      playerVars: {
        autoplay: 1,
        mute: 1,
        loop: 1,
        playlist: VIDEO_ID,
        controls: 1,
        modestbranding: 1,
        rel: 0,
        playsinline: 1
      }
    });
  }

  const tag = document.createElement('script');
  tag.src = "https://www.youtube.com/iframe_api";
  document.body.appendChild(tag);

  const btn = document.getElementById('sound-toggle');
  btn.addEventListener('click', () => {
    if (player.isMuted()) {
      player.unMute();
      btn.textContent = 'Matikan Suara';
    } else {
      player.mute();
      btn.textContent = 'Aktifkan Suara';
    }
  });
</script>

</body>
</html>
