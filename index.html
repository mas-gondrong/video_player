<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Embed Video YouTube Rapi</title>
  <style>
    /* Container untuk video dan tombol */
    #player-container {
      max-width: 640px;
      margin: 20px auto;
      display: flex;
      flex-direction: column; /* tombol di bawah video */
      align-items: center;
      gap: 10px;
    }

    #player {
      width: 100%;
      height: 360px;
      border-radius: 8px;
      background: black;
    }

    #sound-toggle {
      padding: 10px 20px;
      cursor: pointer;
      font-weight: bold;
      border: none;
      background-color: #444;
      color: white;
      border-radius: 6px;
      transition: background-color 0.3s ease;
    }

    #sound-toggle:hover {
      background-color: #666;
    }
  </style>
</head>
<body>

<div id="player-container">
  <div id="player"></div>
  <button id="sound-toggle">Aktifkan Suara</button>
</div>

<script>
  let player;
  const VIDEO_ID = 'nfghPVPu9VE';

  function onYouTubeIframeAPIReady() {
    player = new YT.Player('player', {
      videoId: VIDEO_ID,
      playerVars: {
        autoplay: 1,
        mute: 1,
        loop: 1,
        playlist: VIDEO_ID,
        controls: 1,
        modestbranding: 1,
        rel: 0,
        playsinline: 1
      }
    });
  }

  const tag = document.createElement('script');
  tag.src = "https://www.youtube.com/iframe_api";
  document.body.appendChild(tag);

  const btn = document.getElementById('sound-toggle');
  btn.addEventListener('click', () => {
    if (player.isMuted()) {
      player.unMute();
      btn.textContent = 'Matikan Suara';
    } else {
      player.mute();
      btn.textContent = 'Aktifkan Suara';
    }
  });
</script>

</body>
</html>
