<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Embed Video YouTube</title>
  <style>
    /* Mengatur wadah video agar responsif */
    #player-container {
      position: relative;
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
    }
    #player {
      width: 100%;
      height: 450px;
      border-radius: 12px;
      background: #000;
    }
    #sound-toggle {
      margin-top: 10px;
      padding: 10px 20px;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div id="player-container">
  <div id="player"></div>
  <button id="sound-toggle">Aktifkan Suara</button>
</div>

<script>
  let player;
  // Ganti VIDEO_ID dengan ID video YouTube milikmu
  const VIDEO_ID = 'nfghPVPu9VE'; 

  function onYouTubeIframeAPIReady() {
    player = new YT.Player('player', {
      videoId: nfghPVPu9VE,
      playerVars: {
        autoplay: 1,
        loop: 1,
        playlist: nfghPVPu9VE, // Wajib diisi agar fitur loop berfungsi
        mute: 1,
        controls: 1,
        rel: 0,
        modestbranding: 1
      }
    });
  }

  // Memuat script API secara dinamis
  const tag = document.createElement('script');
  tag.src = "https://www.youtube.com/iframe_api";
  document.body.appendChild(tag);

  // Fungsi toggle suara
  document.getElementById('sound-toggle').addEventListener('click', function() {
    if (player.isMuted()) {
      player.unMute();
      this.textContent = 'Matikan Suara';
    } else {
      player.mute();
      this.textContent = 'Aktifkan Suara';
    }
  });
</script>

</body>
</html>
