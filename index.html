<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>YouTube Video with Box</title>
  <style>
    body, html {
      margin: 0; padding: 0; height: 100%;
      background: #eee;
    }
    #player {
      position: fixed;
      top: 20px;
      left: 20px;
      width: 320px;
      height: 180px;
      border: 3px solid #333;
      border-radius: 10px;
      background-color: black;
      z-index: 9999;
    }
    #sound-toggle {
      position: fixed;
      top: 220px;
      left: 20px;
      z-index: 10000;
      background: rgba(0,0,0,0.7);
      color: white;
      border: none;
      padding: 10px 15px;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
      user-select: none;
    }
  </style>
</head>
<body>

  <div id="player"></div>
  <button id="sound-toggle">Unmute</button>

  <script>
    let player;
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        videoId: 'nfghPVPu9VE', // Ganti dengan video ID yang valid
        playerVars: {
          autoplay: 1,
          controls: 0,
          modestbranding: 1,
          loop: 1,
          playlist: 'nfghPVPu9VE',
          mute: 1,
          rel: 0,
          playsinline: 1
        },
        events: {
          onReady: (event) => {
            event.target.playVideo();
          }
        }
      });
    }

    let tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    document.body.appendChild(tag);

    const btn = document.getElementById('sound-toggle');
    btn.addEventListener('click', () => {
      if (player.isMuted()) {
        player.unMute();
        btn.textContent = 'Mute';
      } else {
        player.mute();
        btn.textContent = 'Unmute';
      }
    });
  </script>

</body>
</html>
